backend = "xrender";
vsync = true;
shadow = false;
fading = true;
fade-in-step = 0.08;
fade-out-step = 0.08;
fade-delta = 8;
corner-radius = 0;
unredir-if-possible = true;
detect-client-opacity = true;

rules = ({
    match = "class_g *?= 'flameshot' || class_i *?= 'flameshot'";
    fade = false;
    unredir = false;
}, {
    match = "window_type = 'normal' && name != 'Control Center' && name != 'Snap preview' && !(class_g *?= 'flameshot' || class_i *?= 'flameshot')";
    fade = false;
    animations = ({
        triggers = ["open"];
        preset = "appear";
        scale = 0.99;
        duration = 0.15;
    }, {
        triggers = ["close"];
        preset = "disappear";
        scale = 1.0;
        duration = 0.11;
    }, {
        triggers = ["geometry"];
        preset = "geometry-change";
        duration = 0.16;
    });
}, {
    match = "name = 'Control Center'";
    animations = ({
        triggers = ["open", "show"];
        preset = "appear";
        scale = 0.98;
        duration = 0.14;
    }, {
        triggers = ["close", "hide"];
        preset = "disappear";
        scale = 0.99;
        duration = 0.10;
    });
});
