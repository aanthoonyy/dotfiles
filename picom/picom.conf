backend = "xrender";
vsync = true;
shadow = false;
shadow-radius = 22;
shadow-opacity = 0.28;
shadow-offset-x = -15;
shadow-offset-y = -15;
shadow-exclude = ["window_type = 'dock'", "window_type = 'desktop'"];
fading = true;
fade-in-step = 0.08;
fade-out-step = 0.08;
fade-delta = 8;
corner-radius = 0;
rounded-corners-exclude = ["window_type = 'dock'", "window_type = 'desktop'"];
unredir-if-possible = true;
detect-client-opacity = true;
